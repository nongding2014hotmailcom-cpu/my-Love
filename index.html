<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถึงคนเก่งของเค้า ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
        }
        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .primary-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }
        .primary-btn:hover {
            transform: scale(1.05);
        }
        .secondary-btn {
            background-color: #f0f0f0;
            color: #666;
        }
        .flower-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none;
        }
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- ใช้ไฟล์เพลงที่เล่นบนเว็บได้แน่นอน -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <!-- ปุ่มควบคุมเพลงมุมขวาจอล่าง -->
    <button class="music-btn hidden" id="musicCtrl" onclick="toggleMusic()">🎵 ปิดเพลง</button>

    <!-- หน้าที่ 1: คำถามแรกเข้า -->
    <div class="container" id="page1">
        <h1>คนเก่งเหนื่อยไหมคะวันนี้? 🥺💖</h1>
        <div class="btn-group">
            <button class="primary-btn" onclick="nextPage('เหนื่อยมากเลย')">เหนื่อยมาก 🥺</button>
            <button class="secondary-btn" onclick="nextPage('ไม่เหนื่อยเลย')">ไม่เหนื่อยคับ 😎</button>
        </div>
    </div>

    <!-- หน้าที่ 2: หน้าเซอร์ไพรส์หลัก -->
    <div class="container hidden" id="page2">
        <!-- ลิงก์รูปภาพการ์ตูนหมีถือดอกไม้ตัวใหม่ สวยงามคมชัด -->
        <img class="flower-img" src="https://pixabay.com" alt="Flower Bear">
        
        <h1 id="dynamicReply">กอด ๆ น้าาา 🧸</h1>
        <p>เค้ารักคนเก่งที่สุดในโลกเลยน้าาา ขอบคุณที่อดทนและตั้งใจมาตลอดเลยนะคะ อยู่เป็นรอยยิ้มให้กันแบบนี้ไปนาน ๆ นะ 🌹✨</p>
        
        <div class="btn-group">
            <button class="primary-btn" onclick="alert('รักเหมือนกันน้าาา จุ๊บๆ 😘')">รักเค้าเหมือนกันมั้ย? (กดเล้ย)</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicCtrl = document.getElementById('musicCtrl');

        function nextPage(userFeel) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            musicCtrl.classList.remove('hidden');
            
            // ปรับระดับเสียงและสั่งให้เล่นเพลงทันทีหลังจากผู้ใช้มีปฏิสัมพันธ์กับหน้าจอ (ผ่านเกณฑ์เบราว์เซอร์)
            music.volume = 0.5;
            music.play().then(() => {
                console.log("Music started playing successfully.");
            }).catch(error => {
                console.log("Playback error: ", error);
            });

            const replyTitle = document.getElementById('dynamicReply');
            if(userFeel === 'เหนื่อยมากเลย') {
                replyTitle.innerHTML = "กอด ๆ น้าคนเก่งของเค้า 🧸💕";
            } else {
                replyTitle.innerHTML = "เก่งที่สุดเลย แฟนใครเนี่ย 🥰💖";
            }
        }

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicCtrl.innerHTML = "🎵 ปิดเพลง";
            } else {
                music.pause();
                musicCtrl.innerHTML = "🔈 เปิดเพลง";
            }
        }
    </script>

</body>
</html>
