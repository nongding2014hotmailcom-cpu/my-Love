<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถึงคนเก่งของเค้า ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
        }
        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }
        .row-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }
        button, .music-link-btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .primary-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }
        .primary-btn:hover {
            transform: scale(1.05);
        }
        .secondary-btn {
            background-color: #f0f0f0;
            color: #666;
        }
        /* ปุ่มลิงก์ฟังเพลงน่ารัก ๆ */
        .music-link-btn {
            background-color: #43aa8b;
            color: white;
            box-shadow: 0 5px 15px rgba(67, 170, 139, 0.4);
            font-size: 1rem;
            margin-top: 10px;
        }
        .music-link-btn:hover {
            transform: scale(1.05);
            background-color: #388e75;
        }
        .flower-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- หน้าที่ 1 -->
    <div class="container" id="page1">
        <h1>คนเก่งเหนื่อยไหมคะวันนี้? 🥺💖</h1>
        <div class="row-btn-group">
            <button class="primary-btn" onclick="nextPage('เหนื่อยมากเลย')">เหนื่อยมาก 🥺</button>
            <button class="secondary-btn" onclick="nextPage('ไม่เหนื่อยเลย')">ไม่เหนื่อยคับ 😎</button>
        </div>
    </div>

    <!-- หน้าที่ 2 -->
    <div class="container hidden" id="page2">
        <img class="flower-img" src="flower.png.png" alt="Flower Pic">
        
        <h1 id="dynamicReply">กอด ๆ น้านะคนเก่ง 🧸</h1>
        <p>เค้ารักคนเก่งที่สุดในโลกเลยน้าาา ขอบคุณที่อดทนและตั้งใจมาตลอดเลยนะคะ อยู่เป็นรอยยิ้มให้กันแบบนี้ไปนาน ๆ นะ 🌹✨</p>
        
        <div class="btn-group">
            <div class="row-btn-group">
                <button class="primary-btn" onclick="alert('รักเหมือนกันน้าาา จุ๊บๆ 😘')">รักเค้าเหมือนกันมั้ย? (กดเล้ย)</button>
            </div>
            
            <!-- ปุ่มแปะลิงก์ URL เพลง Dance with me -->
            <!-- คุณสามารถก๊อปปี้ลิงก์เพลงจาก YouTube หรือ Spotify มาเปลี่ยนตรงคำว่า href="เปลี่ยนลิงก์ตรงนี้" ได้เลยครับ -->
            <a href="https://youtu.be/10GeHGvHUsA?si=xiwUVPFlVsFAaJYl" target="_blank" class="music-link-btn">
                🎵 กดฟังเพลง Dance with me ตรงนี้คับ
            </a>
        </div>
    </div>

    <script>
        function nextPage(userFeel) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');

            const replyTitle = document.getElementById('dynamicReply');
            if(userFeel === 'เหนื่อยมากเลย') {
                replyTitle.innerHTML = "กอด ๆ น้าคนเก่งของเค้า 🧸💕";
            } else {
                replyTitle.innerHTML = "เก่งที่สุดเลย สาวใครเนี่ย 🥰💖";
            }
        }
    </script>

</body>
</html>
