<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff4b6e;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #ff4b6e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
        }
        .btn:hover {
            background-color: #e03e5d;
            transform: scale(1.05);
        }
        #hidden-message {
            display: none;
            margin-top: 20px;
            color: #ff4b6e;
            font-weight: 600;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>ถึงเธอคนพิเศษ ❤️</h1>
        <p>มีอะไรบางอย่างในใจ อยากจะบอกให้เธอได้รู้...</p>
        <button class="btn" onclick="revealLove()">กดตรงนี้สิ</button>
        <div id="hidden-message">
            <p style="color: #ff4b6e; font-size: 20px; margin: 0;">"รักน้าาา แกรมมี่ 🐶!" 😳💖</p>
        </div>
    </div>

    <script>
        function revealLove() {
            document.querySelector('button').style.display = 'none';
            document.getElementById('hidden-message').style.display = 'block';
        }
    </script>
</body>
</html>
